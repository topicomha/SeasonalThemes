name: Check themes

# Fails when a season.jsonc is invalid or a generated file doesn't match what Generate-Themes.ps1 produces
# (a hand-edited generated file, or a season.jsonc change without regenerating). Also builds the VS Code
# extension and attaches the .vsix to the run, so any PR's themes can be installed and tried.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generated files are up to date
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          ./Generate-Themes.ps1 -Check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the VS Code extension
        working-directory: vscode
        run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: seasonal-themes-vsix
          path: vscode/*.vsix
